<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Breakup Reset Launch Banner Preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      background: #d8d3c4;
    }
    .preview-wrap {
      width: 100%;
      max-width: 720px;
    }
  </style>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap');
  .br-banner * { font-family: 'Roboto', sans-serif; box-sizing: border-box; }
  .br-banner {
    background: #EDEAE0;
    border-radius: 20px;
    padding: 56px 48px 48px;
    position: relative;
    overflow: hidden;
    min-height: 320px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    border: 3px solid #234A3D;
  }
  /* Welcome screen bamboo: BambooLogoSvg, transparent bg, no circle, 10% opacity, right, 6deg */
  .bg-bamboo {
    position: absolute;
    right: -24px;
    top: 50%;
    width: 320px;
    height: 320px;
    transform: translateY(-50%) rotate(6deg);
    opacity: 0.1;
    pointer-events: none;
  }
  .bg-bamboo svg {
    display: block;
    width: 100%;
    height: 100%;
  }
  .badge {
    background: #2D6A4F;
    color: #F8F5EC;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 100px;
    margin-bottom: 20px;
    display: inline-block;
  }
  .headline {
    font-size: 42px;
    font-weight: 900;
    color: #1C2B1A;
    line-height: 1.1;
    letter-spacing: -0.5px;
    margin: 0 0 10px;
    text-transform: uppercase;
  }
  .headline span { color: #2D6A4F; }
  .sub {
    font-size: 16px;
    font-weight: 400;
    color: #4A5D45;
    margin: 0 0 32px;
    max-width: 440px;
    line-height: 1.6;
  }
  .cta-btn {
    background: #2D6A4F;
    color: #F8F5EC;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 14px 28px;
    border-radius: 100px;
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
  }
  .sparkle {
    position: absolute;
    top: 28px;
    right: 48px;
    background: #F8F5EC;
    border: 1px solid #D8D3C4;
    border-radius: 100px;
    padding: 6px 14px;
    font-size: 11px;
    font-weight: 700;
    color: #2D6A4F;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .divider-row {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-top: 32px;
    border-top: 1px solid #D8D3C4;
    padding-top: 20px;
    width: 100%;
    max-width: 560px;
  }
  .stat { text-align: left; }
  .stat-num { font-size: 20px; font-weight: 900; color: #234A3D; display: block; }
  .stat-lbl { font-size: 11px; font-weight: 400; color: #5C6B58; text-transform: uppercase; letter-spacing: 1px; }
  .stat-sep { width: 1px; height: 32px; background: #D8D3C4; }
</style>
</head>
<body>
<div class="preview-wrap">
<div class="br-banner">
  <div class="sparkle">Available now</div>

  <div class="bg-bamboo" aria-hidden="true">
    <!-- BambooLogoSvg: background=transparent, showCircle=false (stalk + leaves only, #1F5535) -->
    <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="m108.4 30.28c-0.15 8.68-3.29 24.53-10.35 39.93-0.82 1.9-0.28 3.5 1.62 3.85l10.18 2.2c1.97 0.45 3.15-0.88 3.15-2.85 0.42-10.8 3.71-26.05 9.87-38.99 0.9-1.9-0.07-3.73-2.19-4-2.93-0.35-6-1.25-8.51-2-1.97-0.61-3.74-0.11-3.77 1.86z" fill="#1F5535"/>
      <path d="m97.05 78.16c-0.35 9.65-3.64 26.56-9.34 42.77-0.75 2.19-0.21 4.23 1.98 4.58l9.03 1.69c2.04 0.42 3.01-0.99 3.01-3.1 0.48-11.48 3.78-28.74 9.34-41.89 0.96-2.33-0.14-3.51-2.11-3.86l-8.9-1.9c-1.62-0.42-2.94 0.08-3.01 1.71z" fill="#1F5535"/>
      <path d="m86.29 129.7c-0.35 8.14-2.54 22.17-7.41 36.34-0.75 2.19-0.28 3.75 1.91 4.1l9.1 1.73c2.05 0.42 3.17-0.92 2.96-2.96-0.68-8.47 2.61-24.82 7.21-35.7 0.89-2.19-0.07-3.58-1.69-3.79l-9.42-1.89c-1.69-0.28-2.73 0.36-2.66 2.17z" fill="#1F5535"/>
      <path d="m94.94 68.72c0-11.89-7.71-24.48-19.6-34.38 0.89 11.97 7.59 24.01 19.6 34.38z" fill="#1F5535"/>
      <path d="m65.61 57.46c7.2 0.07 17.6 2.46 29.05 13.84-10.73 0.42-21.03-3.97-29.05-13.84z" fill="#1F5535"/>
      <path d="m104.8 121.8c2.26-11.68 11.95-22.92 27.06-30.26-3.97 11.82-12.9 22.62-27.06 31.17" fill="#1F5535"/>
      <path d="m104.9 124.4c9.1 1.26 19.9-1.07 31.07-8.2-9.28-2.33-20.22-0.43-31.07 8.2z" fill="#1F5535"/>
    </svg>
  </div>

  <div class="badge">It's here</div>

  <h1 class="headline">Your reset<br>starts <span>today.</span></h1>

  <p class="sub">Dealing with a tough breakup? Breakup Reset is out now!<br>Get through this with our help. For free.</p>

  <a class="cta-btn" href="https://play.google.com/store/apps/details?id=com.breakupreset"><i class="ti ti-download" aria-hidden="true"></i> Download free</a>

  <div class="divider-row">
    <div class="stat">
      <span class="stat-num">3</span>
      <span class="stat-lbl">Challenges a day</span>
    </div>
    <div class="stat-sep"></div>
    <div class="stat">
      <span class="stat-num">4</span>
      <span class="stat-lbl">Recovery paths</span>
    </div>
    <div class="stat-sep"></div>
    <div class="stat">
      <span class="stat-num">100%</span>
      <span class="stat-lbl">On your pace</span>
    </div>
  </div>
</div>
</div>
</body>
</html>
