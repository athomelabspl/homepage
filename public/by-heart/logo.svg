<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="100%" height="100%">
<defs>
<!-- Background styling -->
<rect id="bg" width="100%" height="100%" fill="#F7F8F7" rx="16" />
</defs>

<g stroke-linecap="round" stroke-linejoin="round">

<!-- ======================= -->
<!-- DARK SPRUCE CONNECTIONS -->
<!-- ======================= -->
<g stroke="#185C65" stroke-width="2.5">
<!-- Outer Perimeter -->
<line x1="120" y1="205" x2="70" y2="165" />
<line x1="70" y1="165" x2="35" y2="120" />
<line x1="35" y1="120" x2="30" y2="75" />
<line x1="30" y1="75" x2="70" y2="40" />
<line x1="70" y1="40" x2="120" y2="75" />

<line x1="120" y1="75" x2="170" y2="40" />
<line x1="170" y1="40" x2="210" y2="75" />
<line x1="210" y1="75" x2="205" y2="120" />
<line x1="205" y1="120" x2="170" y2="165" />
<line x1="170" y1="165" x2="120" y2="205" />

<!-- Inner Structural Lines (Left) -->
<line x1="120" y1="205" x2="120" y2="160" />
<line x1="120" y1="160" x2="70" y2="165" />
<line x1="70" y1="165" x2="85" y2="135" />
<line x1="35" y1="120" x2="85" y2="135" />
<line x1="35" y1="120" x2="60" y2="100" />
<line x1="30" y1="75" x2="60" y2="100" />
<line x1="70" y1="40" x2="60" y2="100" />
<line x1="120" y1="75" x2="120" y2="115" />
<line x1="120" y1="75" x2="90" y2="85" />
<line x1="120" y1="160" x2="85" y2="135" />

<!-- Reassigned Top-Left Connector -->
<line x1="90" y1="85" x2="70" y2="40" />

<!-- Inner Structural Lines (Right) -->
<line x1="120" y1="160" x2="170" y2="165" />
<line x1="170" y1="40" x2="180" y2="100" />
<line x1="210" y1="75" x2="180" y2="100" />
<line x1="205" y1="120" x2="180" y2="100" />
<line x1="205" y1="120" x2="155" y2="135" />
<line x1="170" y1="165" x2="155" y2="135" />
<line x1="120" y1="75" x2="150" y2="85" />
<line x1="120" y1="160" x2="155" y2="135" />

<!-- Reassigned Top-Right Connector -->
<line x1="150" y1="85" x2="170" y2="40" />
</g>

<!-- ======================= -->
<!-- TURQUOISE CONNECTIONS -->
<!-- ======================= -->
<g stroke="#10CAB7" stroke-width="3">
<!-- Core Center Star -->
<line x1="120" y1="115" x2="90" y2="85" />
<line x1="120" y1="115" x2="85" y2="135" />
<line x1="120" y1="115" x2="150" y2="85" />
<line x1="120" y1="115" x2="155" y2="135" />
<line x1="120" y1="115" x2="120" y2="160" />
<line x1="90" y1="85" x2="85" y2="135" />
<line x1="150" y1="85" x2="155" y2="135" />

<!-- Newly Reassigned Highlighted Links -->
<line x1="60" y1="100" x2="85" y2="135" />
<line x1="60" y1="100" x2="90" y2="85" />
<line x1="180" y1="100" x2="155" y2="135" />
<line x1="180" y1="100" x2="150" y2="85" />
</g>

<!-- ======================= -->
<!-- DARK SPRUCE NODES -->
<!-- ======================= -->
<g fill="#185C65">
<circle cx="120" cy="205" r="4.5" />
<circle cx="70" cy="165" r="4.5" />
<circle cx="35" cy="120" r="4.5" />
<circle cx="30" cy="75" r="4.5" />
<circle cx="120" cy="75" r="4.5" />
<circle cx="210" cy="75" r="4.5" />
<circle cx="205" cy="120" r="4.5" />
<circle cx="170" cy="165" r="4.5" />
<circle cx="70" cy="40" r="4.5" />
<circle cx="170" cy="40" r="4.5" />
</g>

<!-- ======================= -->
<!-- TURQUOISE ACTIVE NODES -->
<!-- ======================= -->
<g fill="#10CAB7">
<circle cx="120" cy="115" r="5.5" />
<circle cx="120" cy="160" r="5.5" />
<circle cx="90" cy="85" r="5.5" />
<circle cx="85" cy="135" r="5.5" />
<circle cx="150" cy="85" r="5.5" />
<circle cx="155" cy="135" r="5.5" />
<circle cx="60" cy="100" r="5.5" />
<circle cx="180" cy="100" r="5.5" />
</g>

</g>
</svg>